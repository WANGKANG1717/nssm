# SvcPilot configuration supports ordinary TOML comments.
Schema = 1

[Unit]
Name = "svcpilot-config-test"
DisplayName = "SvcPilot 声明式配置测试"
Description = "验证 UTF-8 配置文件与参数数组。"

[Service]
ExecStart = 'C:\Windows\System32\cmd.exe'
Arguments = ["/d", "/c", "exit 0"]
InheritEnvironment = true
Environment = ["SVCPILOT_TEST_VALUE=中文值"]
Restart = "on-failure"
RestartSec = "1s"
RestartMaxDelaySec = "1min"
RestartSteps = 2
RestartJitterPercent = 10
StartLimitIntervalSec = "1min"
StartLimitBurst = 5
RestartResetSec = "1min"
MemoryMax = 268435456
TasksMax = 16
CPUQuota = 90

[Windows]
Account = "virtual"
ServiceSid = "unrestricted"
CPUMonitorInterval = "1s"
CPUViolationThreshold = 5

[Readiness]
Type = "process"
StartupTimeoutSec = "30s"
SuccessThreshold = 1

[Health]
Type = "process"
InitialDelaySec = "10s"
IntervalSec = "10s"
TimeoutSec = "5s"
FailureThreshold = 3
SuccessThreshold = 1

[Logging]
Timestamp = true

[Logging.Stdout]
Path = 'C:\Logs\worker.log'

[Logging.Stderr]
Path = 'C:\Logs\worker-error.log'

[Logging.Rotation]
MaximumBytes = 10485760
