name: Build SvcPilot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MinGW-w64 UCRT64 (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        include:
          - preset: debug
            configuration: Debug
          - preset: release
            configuration: Release

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils

      - name: Verify toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
          windmc --version
          windres --version
          test "$(g++ -dumpfullversion -dumpversion | cut -d. -f1)" -ge 14

      - name: Configure
        run: cmake --preset mingw-${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset mingw-${{ matrix.preset }}

      - name: Test
        run: ctest --preset mingw-${{ matrix.preset }}

      - name: Verify x64 static runtime
        run: |
          executable="out/${{ matrix.configuration }}/win64/svp.exe"
          objdump -f "$executable" | grep -q 'file format pei-x86-64'
          if objdump -p "$executable" | grep -Eqi 'DLL Name: (libgcc_s|libstdc\+\+|libwinpthread)'; then
            echo 'Unexpected dynamic MinGW runtime dependency' >&2
            exit 1
          fi

      - name: SCM lifecycle integration test
        if: matrix.preset == 'release'
        shell: powershell
        run: >-
          .\tests\integration\service_lifecycle.ps1
          -Executable .\out\Release\win64\svp.exe

      - name: Sign release executable
        if: matrix.preset == 'release'
        shell: powershell
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE)) {
            Write-Host 'Signing certificate is not configured; producing an unsigned release.'
            exit 0
          }
          .\cmake\SignWindowsBinary.ps1 `
            -Executable .\out\Release\win64\svp.exe `
            -CertificateBase64 $env:SIGNING_CERTIFICATE `
            -CertificatePassword $env:SIGNING_PASSWORD

      - name: Package release
        if: matrix.preset == 'release'
        shell: powershell
        run: >-
          .\cmake\PackageRelease.ps1
          -Executable .\out\Release\win64\svp.exe
          -OutputDirectory .\out\package
          -Version 3.1.4
          -SourceDirectory .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: svcpilot-win64-${{ matrix.configuration }}
          path: out/${{ matrix.configuration }}/win64/svp.exe
          if-no-files-found: error

      - name: Upload release bundle
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: svcpilot-win64-release-bundle
          path: |
            out/package/svcpilot-3.1.4-win64.zip
            out/package/svcpilot-3.1.4-win64.zip.sha256
          if-no-files-found: error
